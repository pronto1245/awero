name: AWERO
options:
  bundleIdPrefix: app
  deploymentTarget:
    iOS: "17.0"
targets:
  AWERO:
    type: application
    platform: iOS
    sources:
      - path: AWERO
        excludes:
          - App/README.md
    info:
      path: Generated/AWERO-Info.plist
      properties:
        NSAlarmKitUsageDescription: AWERO schedules wake-up alarms that can alert while your iPhone is locked or in Focus.
        NSSupportsLiveActivities: true
    scheme:
      testTargets:
        - AWEROTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.awero
        PRODUCT_NAME: AWERO
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: AWERO
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_NSCameraUsageDescription: AWERO uses the camera to scan QR codes for wake missions.
        INFOPLIST_KEY_NSMotionUsageDescription: AWERO uses motion activity to count steps during wake missions.
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: "YES"
  AWEROTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AWEROTests
    dependencies:
      - target: AWERO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.awero.tests
        PRODUCT_NAME: AWEROTests
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
