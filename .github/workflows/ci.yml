name: AWERO CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: awero-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p apps/android :app:assembleDebug
      - run: gradle -p apps/android :app:testDebugUnitTest
      - name: Enable Android emulator hardware acceleration
        run: |
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run Android persistence instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-linux-hw-accel: false
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle -p apps/android :app:connectedDebugAndroidTest

      - name: Collect Android emulator diagnostics
        if: always()
        run: adb logcat -d > android-logcat.txt 2>&1 || true
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-persistence-reports
          path: |
            apps/android/app/build/reports/tests/
            apps/android/app/build/reports/androidTests/
            apps/android/app/build/outputs/androidTest-results/
            android-logcat.txt
          if-no-files-found: warn

  ios-syntax:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck Swift sources
        shell: bash
        run: |
          SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
          find apps/ios -name '*.swift' -print0 | xargs -0 swiftc -typecheck -sdk "$SDK_PATH" -target arm64-apple-ios18.0-simulator

  ios-persistence-smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run persistence smoke test
        shell: bash
        run: |
          swiftc \
            apps/ios/AWERO/Core/Alarm/AlarmModels.swift \
            apps/ios/AWERO/Core/Alarm/AlarmScheduler.swift \
            apps/ios/AWERO/Core/Sync/SyncOperation.swift \
            apps/ios/AWERO/Core/WakeSession/WakeSession.swift \
            apps/ios/AWERO/Core/WakeSession/WakeSessionManager.swift \
            apps/ios/AWERO/Core/WakeSession/WakeFlowController.swift \
            apps/ios/AWERO/Core/Statistics/StatisticsStore.swift \
            apps/ios/AWERO/Core/Analytics/AnalyticsQueueStore.swift \
            apps/ios/AWERO/Core/Storage/CoreDataStore.swift \
            apps/ios/Tests/PersistenceSmokeMain.swift \
            -o /tmp/awero-persistence-smoke
          /tmp/awero-persistence-smoke
      - name: Verify persistence across forced process termination
        shell: bash
        run: |
          set -euo pipefail
          CRASH_DIR=$(mktemp -d)
          CRASH_PATH="$CRASH_DIR/AWERO.sqlite"
          PID=""
          trap 'if [ -n "$PID" ]; then kill -9 "$PID" 2>/dev/null || true; fi; rm -rf "$CRASH_DIR"' EXIT
          AWERO_CRASH_PHASE=write AWERO_CRASH_PATH="$CRASH_PATH" /tmp/awero-persistence-smoke &
          PID=$!
          for ATTEMPT in $(seq 1 300); do
            if [ -f "$CRASH_PATH.ready" ]; then break; fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "Crash fixture exited before committing data"
              exit 1
            fi
            sleep 0.1
          done
          test -f "$CRASH_PATH.ready"
          kill -9 "$PID"
          EXIT_CODE=0
          wait "$PID" || EXIT_CODE=$?
          PID=""
          test "$EXIT_CODE" -eq 137
          AWERO_CRASH_PHASE=read AWERO_CRASH_PATH="$CRASH_PATH" /tmp/awero-persistence-smoke
